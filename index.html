  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ỉ việc lấy ra ăn. Ít quyết định = dễ giữ nếp hơn.', en: 'Mix it the night before. Fewer decisions in the morning = easier to keep the habit.' },\n      swaps: [\n        { name: { vi: 'Bánh mì trứng ốp la + sữa tươi', en: 'Egg banh mi + milk' }, kcal: 430, p: 22, tag: { vi: 'Tương đương', en: 'Equivalent' }, why: { vi: 'Mua được ở bất cứ đâu. Nhớ xin ít bơ/pate.', en: 'Available anywhere. Ask for less butter/pâté.' } },\n        { name: { vi: 'Phở gà ít bánh + 1 trứng', en: 'Chicken pho, less noodle + 1 egg' }, kcal: 450, p: 30, tag: { vi: 'Nhiều đạm hơn', en: 'More protein' }, why: { vi: 'Xin ít bánh phở, thêm trứng để đủ đạm buổi sáng.', en: 'Less noodle, add an egg to hit morning protein.' } },\n        { name: { vi: 'Whey + chuối + 1 lát bánh mì', en: 'Whey + banana + 1 slice bread' }, kcal: 380, p: 32, tag: { vi: 'Nhanh nhất', en: 'Fastest' }, why: { vi: 'Cho hôm nào dậy muộn — 2 phút là xong.', en: 'For late mornings — done in 2 minutes.' } }\n      ] },\n    { id: 'm2', time: '10:00', slot: { vi: 'Bữa phụ', en: 'Snack' },\n      name: { vi: 'Sữa chua Hy Lạp + hạt điều', en: 'Greek yogurt + cashews' },\n      kcal: 180, p: 15, c: 12, f: 8,\n      items: [ { vi: 'Sữa chua Hy Lạp không đường', en: 'Plain Greek yogurt', qty: '150g' }, { vi: 'Hạt điều', en: 'Cashews', qty: '10 hạt' } ],\n      tip: { vi: 'Để sẵn trong tủ lạnh văn phòng. Cái gì trong tầm tay thì mình sẽ ăn.', en: 'Keep it in the office fridge. We eat what is within reach.' },\n      swaps: [\n        { name: { vi: '2 quả trứng luộc', en: '2 boiled eggs' }, kcal: 155, p: 13, tag: { vi: 'Tương đương', en: 'Equivalent' }, why: { vi: 'Luộc sẵn 6 quả vào Chủ nhật.', en: 'Boil six on Sunday.' } },\n        { name: { vi: 'Whey + 1 quả táo', en: 'Whey + an apple' }, kcal: 200, p: 26, tag: { vi: 'Nhiều đạm hơn', en: 'More protein' }, why: { vi: 'Hôm nào bữa trưa ít đạm thì chọn cái này.', en: 'Pick this when lunch is low in protein.' } }\n      ] },\n    { id: 'm3', time: '12:15', slot: { vi: 'Bữa trưa', en: 'Lunch' },\n      name: { vi: 'Cơm gạo lứt, ức gà áp chảo, rau luộc', en: 'Brown rice, pan-seared chicken, greens' },\n      kcal: 560, p: 45, c: 62, f: 13,\n      items: [ { vi: 'Cơm gạo lứt', en: 'Brown rice', qty: '1 bát (150g)' }, { vi: 'Ức gà', en: 'Chicken breast', qty: '160g' }, { vi: 'Rau cải luộc', en: 'Boiled greens', qty: '1 đĩa' }, { vi: 'Dầu ô liu', en: 'Olive oil', qty: '1 thìa' } ],\n      tip: { vi: 'Nếu ăn ngoài: chọn quán cơm, xin thêm rau và bớt nửa bát cơm. Không cần hoàn hảo.', en: 'Eating out? Pick a rice shop, add greens, halve the rice. It does not need to be perfect.' },\n      swaps: [\n        { name: { vi: 'Cơm tấm sườn nướng (bỏ mỡ, thêm rau)', en: 'Com tam grilled pork (trim fat, add greens)' }, kcal: 620, p: 38, tag: { vi: 'Ăn ngoài', en: 'Eating out' }, why: { vi: 'Cắt bỏ phần mỡ, xin thêm dưa leo và cà chua.', en: 'Trim the fat cap, ask for cucumber and tomato.' } },\n        { name: { vi: 'Bún thịt nướng nhiều rau', en: 'Bun thit nuong, extra veg' }, kcal: 540, p: 32, tag: { vi: 'Ăn ngoài', en: 'Eating out' }, why: { vi: 'Chan ít nước mắm pha, ăn hết phần rau sống.', en: 'Go light on the sauce, finish the raw veg.' } },\n        { name: { vi: 'Salad ức gà + 1 lát bánh mì', en: 'Chicken salad + 1 slice bread' }, kcal: 470, p: 44, tag: { vi: 'Nhẹ hơn', en: 'Lighter' }, why: { vi: 'Chọn hôm nào bữa tối có tiệc.', en: 'Use this on days with a dinner out.' } }\n      ] },\n    { id: 'm4', time: '16:00', slot: { vi: 'Bữa phụ', en: 'Snack' },\n      name: { vi: 'Táo + 10 hạt hạnh nhân', en: 'Apple + 10 almonds' },\n      kcal: 190, p: 5, c: 26, f: 8,\n      items: [ { vi: 'Táo', en: 'Apple', qty: '1 quả' }, { vi: 'Hạnh nhân', en: 'Almonds', qty: '10 hạt' } ],\n      tip: { vi: 'Bữa phụ này giữ cho bạn không đói cồn cào lúc 7h tối — đó mới là lúc dễ ăn quá đà.', en: 'This snack stops the 7pm crash — that is when overeating actually happens.' },\n      swaps: [\n        { name: { vi: 'Sữa chua không đường', en: 'Plain yogurt' }, kcal: 120, p: 10, tag: { vi: 'Nhẹ hơn', en: 'Lighter' }, why: { vi: 'Nếu bữa trưa hơi nhiều.', en: 'If lunch ran heavy.' } },\n        { name: { vi: 'Chuối + whey (trước khi tập)', en: 'Banana + whey (pre-workout)' }, kcal: 240, p: 26, tag: { vi: 'Trước tập', en: 'Pre-workout' }, why: { vi: 'Ăn trước buổi tập 18:30 khoảng 60–90 phút.', en: 'Take it 60–90 min before your 18:30 session.' } }\n      ] },\n    { id: 'm5', time: '19:30', slot: { vi: 'Bữa tối', en: 'Dinner' },\n      name: { vi: 'Cá nướng, khoai lang & salad', en: 'Baked fish, sweet potato & salad' },\n      kcal: 500, p: 38, c: 42, f: 18,\n      items: [ { vi: 'Cá basa / cá hồi', en: 'Basa / salmon', qty: '180g' }, { vi: 'Khoai lang', en: 'Sweet potato', qty: '180g' }, { vi: 'Salad rau trộn', en: 'Mixed salad', qty: '1 bát lớn' }, { vi: 'Dầu ô liu', en: 'Olive oil', qty: '1 thìa' } ],\n      tip: { vi: 'Sau tập nên ăn trong vòng 1–2 tiếng. Không cần vội, nhưng đừng bỏ bữa.', en: 'Eat within 1–2 hours post-training. No rush, but do not skip it.' },\n      swaps: [\n        { name: { vi: 'Lẩu nấm + đậu hũ + thịt bò', en: 'Mushroom hotpot + tofu + beef' }, kcal: 530, p: 40, tag: { vi: 'Ăn cùng gia đình', en: 'Family meal' }, why: { vi: 'Ăn nhiều rau trước, thịt sau, bún cuối cùng.', en: 'Veg first, meat second, noodles last.' } },\n        { name: { vi: 'Ức gà + cơm + canh rau', en: 'Chicken + rice + veg soup' }, kcal: 510, p: 44, tag: { vi: 'Tương đương', en: 'Equivalent' }, why: { vi: 'Bữa cơm nhà chuẩn — chỉ cần đủ đạm và đủ rau.', en: 'A normal home dinner — just hit protein and veg.' } }\n      ] }\n  ];\n\n  HABITS = [\n    { id: 'h1', label: { vi: 'Đủ đạm ở cả 3 bữa chính', en: 'Protein in all 3 main meals' }, hint: { vi: 'Bằng lòng bàn tay mỗi bữa', en: 'A palm-sized portion each' } },\n    { id: 'h2', label: { vi: '2 phần rau trở lên', en: '2+ servings of vegetables' }, hint: { vi: 'Mỗi phần bằng nắm tay', en: 'One fist each' } },\n    { id: 'h3', label: { vi: 'Uống đủ ~2 lít nước', en: 'Drink ~2 litres of water' }, hint: { vi: '1 chai 500ml × 4', en: '4 × 500ml bottle' } },\n    { id: 'h4', label: { vi: 'Đi ngủ trước 23:00', en: 'In bed before 23:00' }, hint: { vi: 'Ngủ đủ giúp bạn bớt thèm ăn vặt', en: 'Sleep blunts the snack cravings' } }\n  ];\n\n  LESSONS = [\n    { id: 'l1', tier: { vi: 'Tầng 1 · Nền tháp', en: 'Tier 1 · Base' }, mins: 2,\n      title: { vi: 'Vì sao calo là nền của mọi thứ', en: 'Why calories are the base of everything' },\n      hook: { vi: 'Trước khi lo ăn sạch hay ăn bẩn, hãy hiểu điều quan trọng nhất.', en: 'Before clean vs dirty eating, understand the one thing that matters most.' },\n      paras: { vi: ['Cơ thể bạn không đọc nhãn \"healthy\". Nó cộng năng lượng vào và trừ năng lượng ra. Nếu tổng năng lượng vào ít hơn ra, bạn giảm cân — dù bạn ăn gạo lứt hay ăn cơm trắng.', 'Điều đó không có nghĩa chất lượng thức ăn không quan trọng. Nó quan trọng ở tầng trên. Nhưng nếu bạn ăn \"sạch\" mà vẫn dư năng lượng, cân nặng sẽ không đổi. Rất nhiều người mất một năm ở chỗ này.', 'Vì vậy tuần này chúng ta không đổi món ăn của bạn. Chúng ta chỉ giữ khẩu phần ổn định, ngày này qua ngày khác. Đó là 80% kết quả.'],\n        en: ['Your body does not read the word \"healthy\". It adds energy in and subtracts energy out. If in is less than out, you lose weight — brown rice or white rice.', 'That does not mean food quality is irrelevant. It matters — one tier up. But eating clean in a surplus still means no change. Many people lose a year here.', 'So this week we do not change what you eat. We keep portions steady, day after day. That is 80% of the result.'] },\n      takeaway: { vi: 'Ổn định khẩu phần quan trọng hơn hoàn hảo món ăn.', en: 'Steady portions beat perfect food choices.' },\n      action: { vi: 'Hôm nay ăn đúng 5 bữa trong kế hoạch, không thêm không bớt. Chỉ vậy thôi.', en: 'Eat the 5 planned meals today. Nothing added, nothing skipped. That is all.' } },\n    { id: 'l2', tier: { vi: 'Tầng 1 · Nền tháp', en: 'Tier 1 · Base' }, mins: 2,\n      title: { vi: 'Ăn ít calo mà vẫn no', en: 'Eating fewer calories and still feeling full' },\n      hook: { vi: 'Đói không phải là dấu hiệu bạn đang làm đúng.', en: 'Hunger is not proof you are doing it right.' },\n      paras: { vi: ['Cùng 500 kcal, một bát phở làm bạn no 4 tiếng, còn một ly trà sữa thì 40 phút. Khác biệt nằm ở mật độ năng lượng: nước, chất xơ và đạm chiếm chỗ trong dạ dày mà mang ít calo.', 'Đó là lý do kế hoạch của bạn luôn có rau và đạm ở mỗi bữa. Không phải vì rau \"thần thánh\", mà vì nó giúp bạn ăn ít hơn mà không phải gồng ý chí.', 'Ý chí là nguồn lực có hạn. Thiết kế bữa ăn để bạn không cần dùng đến nó.'],\n        en: ['At the same 500 kcal, a bowl of pho keeps you full for 4 hours; bubble tea for 40 minutes. The difference is energy density: water, fibre and protein take up stomach space cheaply.', 'That is why your plan has vegetables and protein at every meal. Not because veg is magic, but because it lets you eat less without white-knuckling it.', 'Willpower is a limited resource. Design meals so you do not have to spend it.'] },\n      takeaway: { vi: 'Đừng dựa vào ý chí. Dựa vào rau, đạm và nước.', en: 'Do not rely on willpower. Rely on veg, protein and water.' },\n      action: { vi: 'Thêm một nắm rau vào bữa trưa hôm nay, ăn rau trước khi ăn cơm.', en: 'Add a fist of vegetables to lunch today, and eat it before the rice.' } },\n    { id: 'l3', tier: { vi: 'Tầng 2 · Chất đa lượng', en: 'Tier 2 · Macros' }, mins: 2,\n      title: { vi: 'Đạm: bao nhiêu là đủ với bạn', en: 'Protein: how much you actually need' },\n      hook: { vi: 'Con số duy nhất đáng nhớ trong cả tháng này.', en: 'The one number worth memorising this month.' },\n      paras: { vi: ['Khi giảm mỡ, đạm giữ lại phần cơ bạn đã cực khổ xây. Mục tiêu của bạn là khoảng 2g cho mỗi kg cân nặng — với bạn là ~127g mỗi ngày.', 'Nghe thì nhiều, nhưng chia ra là khoảng 30–40g mỗi bữa chính: một ức gà, một khúc cá, hoặc 3 quả trứng cộng hộp sữa chua.', 'Nếu một ngày bạn chỉ làm được một việc, hãy làm việc này. Đủ đạm là thứ dễ đo, dễ kiểm tra, và ảnh hưởng lớn nhất đến hình thể của bạn.'],\n        en: ['In a deficit, protein protects the muscle you worked for. Your target is roughly 2g per kg of bodyweight — about 127g a day.', 'It sounds like a lot, but it is 30–40g per main meal: a chicken breast, a fillet of fish, or 3 eggs plus a yogurt.', 'If you only do one thing on a busy day, do this. Protein is easy to measure, easy to check, and has the biggest effect on how you end up looking.'] },\n      takeaway: { vi: 'Một lòng bàn tay đạm ở mỗi bữa chính. Đó là cả bài học.', en: 'One palm of protein per main meal. That is the whole lesson.' },\n      action: { vi: 'Kiểm tra vòng tròn trên màn hình Hôm nay trước khi đi ngủ — đạm đã đủ chưa?', en: 'Check the ring on Today before bed — did protein land?' } },\n    { id: 'l4', tier: { vi: 'Tầng 2 · Chất đa lượng', en: 'Tier 2 · Macros' }, mins: 2,\n      title: { vi: 'Tinh bột không phải kẻ thù', en: 'Carbs are not the enemy' },\n      hook: { vi: 'Cơm không làm bạn béo. Tổng năng lượng mới làm.', en: 'Rice does not make you fat. Total energy does.' },\n      paras: { vi: ['Bỏ cơm giúp giảm cân nhanh trong tuần đầu vì bạn mất nước và glycogen, không phải mỡ. Sau đó bạn mệt, tập kém, rồi ăn bù.', 'Với người tập luyện, tinh bột là nhiên liệu. Giữ lại nó, chỉ cần đặt đúng chỗ: nhiều hơn quanh buổi tập, ít hơn vào ngày nghỉ.', 'Kế hoạch của bạn đã làm sẵn điều này. Bạn không cần tính toán gì thêm.'],\n        en: ['Cutting rice drops weight fast in week one because you lose water and glycogen, not fat. Then you get tired, train worse, and eat it back.', 'If you train, carbs are fuel. Keep them, just place them: more around training, fewer on rest days.', 'Your plan already does this. You do not need to calculate anything.'] },\n      takeaway: { vi: 'Giữ tinh bột, đặt nó quanh buổi tập.', en: 'Keep carbs, place them around training.' },\n      action: { vi: 'Hôm nay là ngày tập — ăn đủ phần khoai lang buổi tối, đừng cắt.', en: 'Today is a training day — eat the full sweet potato at dinner, do not cut it.' } },\n    { id: 'l5', tier: { vi: 'Tầng 2 · Chất đa lượng', en: 'Tier 2 · Macros' }, mins: 2,\n      title: { vi: 'Chất béo và chất xơ', en: 'Fat and fibre' },\n      hook: { vi: 'Hai thứ ít ai để ý nhưng quyết định bạn có thấy dễ chịu không.', en: 'Two overlooked things that decide whether this feels easy.' },\n      paras: { vi: ['Chất béo cần cho hormone. Đừng cắt xuống quá thấp — khoảng 0,8–1g/kg là ổn. Nguồn tốt: cá, hạt, dầu ô liu, bơ.', 'Chất xơ giúp tiêu hoá và giữ no. Mục tiêu 25–30g mỗi ngày, đến chủ yếu từ rau, đậu và trái cây nguyên quả.', 'Đây cũng là hai thứ dễ thiếu nhất khi bạn ăn ngoài nhiều.'],\n        en: ['Fat supports hormones. Do not crush it — 0.8–1g/kg is fine. Good sources: fish, nuts, olive oil, avocado.', 'Fibre helps digestion and fullness. Aim for 25–30g a day, mostly from vegetables, beans and whole fruit.', 'These are also the two things that go missing when you eat out a lot.'] },\n      takeaway: { vi: 'Đừng sợ chất béo tốt. Đừng quên chất xơ.', en: 'Do not fear good fats. Do not forget fibre.' },\n      action: { vi: 'Thêm một phần trái cây nguyên quả hôm nay thay vì nước ép.', en: 'Add one whole fruit today instead of juice.' } },\n    { id: 'l6', tier: { vi: 'Tầng 3 · Vi chất & nước', en: 'Tier 3 · Micros & water' }, mins: 2,\n      title: { vi: 'Rau, vi chất và nước', en: 'Vegetables, micronutrients and water' },\n      hook: { vi: 'Tầng này rẻ tiền nhất nhưng bị bỏ qua nhiều nhất.', en: 'The cheapest tier, and the most skipped.' },\n      paras: { vi: ['Không cần thực phẩm siêu cấp. Nhiều màu sắc trên đĩa là đủ: xanh đậm, đỏ, cam, trắng.', 'Nước: thiếu nước làm bạn mệt và tưởng là đói. Uống trước mỗi bữa một ly.'],\n        en: ['You do not need superfoods. A few colours on the plate is enough: dark green, red, orange, white.', 'Water: mild dehydration reads as tiredness and hunger. Drink a glass before each meal.'] },\n      takeaway: { vi: 'Nhiều màu trên đĩa, một ly nước trước mỗi bữa.', en: 'Colour on the plate, a glass before each meal.' },\n      action: { vi: 'Đặt một chai nước 500ml trên bàn làm việc ngay bây giờ.', en: 'Put a 500ml bottle on your desk right now.' } },\n    { id: 'l7', tier: { vi: 'Tầng 4 · Thời điểm', en: 'Tier 4 · Timing' }, mins: 2,\n      title: { vi: 'Ăn trước và sau khi tập', en: 'Eating around training' },\n      hook: { vi: 'Ít quan trọng hơn bạn nghĩ — nhưng vẫn đáng làm đúng.', en: 'Less important than you think — still worth getting right.' },\n      paras: { vi: ['Không có \"cửa sổ vàng 30 phút\". Điều quan trọng là tổng đạm trong ngày và ăn một bữa có đạm trong vòng vài giờ quanh buổi tập.', 'Trước tập 60–90 phút: một bữa nhẹ có tinh bột. Sau tập: bữa chính bình thường.'],\n        en: ['There is no 30-minute anabolic window. What matters is daily protein and having a protein meal within a few hours of training.', '60–90 min before: a light carb snack. After: your normal main meal.'] },\n      takeaway: { vi: 'Tổng cả ngày quan trọng hơn thời điểm.', en: 'Daily totals beat timing.' },\n      action: { vi: 'Ăn bữa phụ 16:00 trước buổi tập tối nay.', en: 'Have the 16:00 snack before tonight\\u2019s session.' } },\n    { id: 'l8', tier: { vi: 'Tầng 5 · Bổ sung', en: 'Tier 5 · Supplements' }, mins: 2,\n      title: { vi: 'Thực phẩm bổ sung: cái nào đáng tiền', en: 'Supplements: what is worth the money' },\n      hook: { vi: 'Đỉnh tháp — chỉ chiếm vài phần trăm kết quả.', en: 'Top of the pyramid — a few percent of the result.' },\n      paras: { vi: ['Whey: tiện, không thần kỳ. Chỉ là đạm dạng bột. Creatine: rẻ, an toàn, có bằng chứng tốt cho người tập tạ. Vitamin D nếu bạn ít ra nắng.', 'Còn lại phần lớn là marketing. Tiền đó để mua thực phẩm tươi sẽ hiệu quả hơn.'],\n        en: ['Whey: convenient, not magic. It is powdered protein. Creatine: cheap, safe, well-evidenced for lifters. Vitamin D if you get little sun.', 'Most of the rest is marketing. That money buys better groceries.'] },\n      takeaway: { vi: 'Whey, creatine, vitamin D. Hết.', en: 'Whey, creatine, vitamin D. That is it.' },\n      action: { vi: 'Không mua gì mới tuần này. Tập trung vào tầng 1.', en: 'Buy nothing new this week. Focus on tier 1.' } }\n  ];\n\n  FOODS = [\n    { name: { vi: 'Phở bò tái', en: 'Beef pho (rare)' }, kcal: 420, p: 28, grade: 'A', tip: { vi: 'Lựa chọn tốt. Xin ít bánh phở, thêm giá và rau. Không uống hết nước dùng nếu đang giảm mỡ.', en: 'Solid choice. Less noodle, more sprouts and herbs. Skip finishing the broth in a deficit.' } },\n    { name: { vi: 'Cơm tấm sườn bì chả', en: 'Com tam (pork chop, skin, egg loaf)' }, kcal: 780, p: 34, grade: 'C', tip: { vi: 'Nặng calo vì mỡ và bì. Gọi riêng sườn + cơm, bỏ bì và chả, thêm dưa leo.', en: 'Heavy from fat and skin. Order chop + rice only, skip the skin and loaf, add cucumber.' } },\n    { name: { vi: 'Bún chả Hà Nội', en: 'Bun cha' }, kcal: 620, p: 32, grade: 'B', tip: { vi: 'Ăn hết rổ rau sống, chan ít nước chấm, để lại phần mỡ trong chả.', en: 'Finish the herb basket, go light on the dipping sauce, leave the fatty pieces.' } },\n    { name: { vi: 'Bánh mì thịt', en: 'Banh mi (pork)' }, kcal: 480, p: 20, grade: 'B', tip: { vi: 'Xin ít bơ và pate, thêm trứng để tăng đạm. Tiện cho bữa sáng vội.', en: 'Less butter and pâté, add an egg for protein. Good for a rushed morning.' } },\n    { name: { vi: 'Gỏi cuốn tôm thịt (3 cuốn)', en: 'Fresh spring rolls (3)' }, kcal: 260, p: 16, grade: 'A', tip: { vi: 'Bữa nhẹ lý tưởng. Chấm nước mắm thay vì tương đậu phộng.', en: 'Ideal light meal. Use fish sauce instead of peanut sauce.' } },\n    { name: { vi: 'Bún bò Huế', en: 'Bun bo Hue' }, kcal: 560, p: 30, grade: 'B', tip: { vi: 'Nhiều đạm nhưng nước dùng nhiều dầu. Không húp hết nước.', en: 'Good protein but oily broth. Do not drink it all.' } },\n    { name: { vi: 'Cơm gà xối mỡ', en: 'Crispy fried chicken rice' }, kcal: 850, p: 36, grade: 'D', tip: { vi: 'Chiên ngập dầu, cơm chiên mỡ gà. Nếu thèm, chia đôi phần và thêm một đĩa rau.', en: 'Deep-fried plus fat-cooked rice. If you crave it, halve the portion and add greens.' } },\n    { name: { vi: 'Salad ức gà', en: 'Grilled chicken salad' }, kcal: 380, p: 40, grade: 'A', tip: { vi: 'Xin sốt để riêng — sốt mè rang có thể thêm 200 kcal.', en: 'Ask for dressing on the side — sesame dressing can add 200 kcal.' } },\n    { name: { vi: 'Trà sữa trân châu (size M)', en: 'Bubble tea (medium)' }, kcal: 450, p: 4, grade: 'D', tip: { vi: 'Bằng cả một bữa chính nhưng không no. Nếu uống, chọn 30% đường, bỏ trân châu.', en: 'A whole meal in calories with no fullness. If you must: 30% sugar, no pearls.' } },\n    { name: { vi: 'Xôi mặn', en: 'Savoury sticky rice' }, kcal: 600, p: 14, grade: 'C', tip: { vi: 'Nhiều tinh bột, ít đạm. Thêm trứng hoặc sữa chua cho cân bằng.', en: 'Carb-heavy, protein-light. Add an egg or a yogurt.' } },\n    { name: { vi: 'Lẩu nấm (1 phần)', en: 'Mushroom hotpot (1 serving)' }, kcal: 480, p: 34, grade: 'A', tip: { vi: 'Bữa nhóm dễ kiểm soát nhất. Ăn rau trước, thịt sau, bún cuối.', en: 'The easiest group meal to control. Veg first, meat second, noodles last.' } }\n  ];\n\n  GROCERY = [\n    { cat: { vi: 'Đạm', en: 'Protein' }, items: [ { id: 'g1', vi: 'Ức gà', en: 'Chicken breast', qty: '1.2 kg' }, { id: 'g2', vi: 'Cá basa phi lê', en: 'Basa fillet', qty: '900 g' }, { id: 'g3', vi: 'Trứng gà', en: 'Eggs', qty: '20 quả' }, { id: 'g4', vi: 'Sữa chua Hy Lạp', en: 'Greek yogurt', qty: '7 hộp' } ] },\n    { cat: { vi: 'Tinh bột', en: 'Carbs' }, items: [ { id: 'g5', vi: 'Gạo lứt', en: 'Brown rice', qty: '2 kg' }, { id: 'g6', vi: 'Khoai lang', en: 'Sweet potato', qty: '1.5 kg' }, { id: 'g7', vi: 'Yến mạch cán', en: 'Rolled oats', qty: '500 g' } ] },\n    { cat: { vi: 'Rau & trái cây', en: 'Veg & fruit' }, items: [ { id: 'g8', vi: 'Rau cải các loại', en: 'Leafy greens', qty: '2 kg' }, { id: 'g9', vi: 'Cà chua, dưa leo', en: 'Tomato, cucumber', qty: '1 kg' }, { id: 'g10', vi: 'Chuối', en: 'Bana
